name: Bygg GlassHome

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: SIGNING_KEY
    steps:
      - uses: actions/checkout@v4

      - name: Lägg in signeringsnyckeln
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Lägg till hemligheten SIGNING_KEY under Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > app/glasshome.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bygg APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Döp om APK
        run: cp app/build/outputs/apk/release/app-release.apk GlassHome.apk

      - name: Skapa release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GlassHome 1.0.${{ github.run_number }}
          body: Automatiskt bygge
          files: GlassHome.apk
          make_latest: true
